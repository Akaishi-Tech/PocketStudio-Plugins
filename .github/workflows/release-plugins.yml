name: Release Pocket Studio plugins
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        type: choice
        options: [codex, android, avf, proot, all]
        default: codex
      source_run_id:
        description: Successful build-all run ID from the pinned PocketStudio commit
        type: string
        required: false
      publish:
        description: Publish verified artifacts to the plugin store
        type: boolean
        default: false
      staging_tag:
        description: Optional draft tag containing the signed plugin APKs and build metadata
        type: string
        required: false
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: plugin-store-release
  queue: max

permissions: {}
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(github.event_name == 'schedule' && '["codex","android"]' || format('["{0}"]', inputs.plugin || 'codex')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    env:
      PLUGIN: ${{ matrix.plugin }}
      STAGING_TAG: ${{ inputs.staging_tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CAN_SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release behavior
        run: python3 -B scripts/test_release.py
      - name: Select source and release mode
        id: source
        run: |
          set -eu
          commit=$(cat SOURCE_COMMIT)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ -n "$STAGING_TAG" && -n "$SOURCE_RUN_ID" ]]; then
            echo "::error::Select either source_run_id or staging_tag."
            exit 1
          fi
          if [[ "$PLUGIN" == all && -z "$SOURCE_RUN_ID" ]]; then
            echo "::error::Select a successful source build-all run to verify all plugins."
            exit 1
          fi
          if [[ -n "$SOURCE_RUN_ID" || -n "$STAGING_TAG" || "$CAN_SIGN" == true ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::error::Select a signed source run or a signed staging draft."
            exit 1
          fi
      - name: Check out pinned build recipe
        if: steps.source.outputs.active == 'true' && env.STAGING_TAG == '' && env.SOURCE_RUN_ID == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Akaishi-Tech/PocketStudio
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Download signed artifacts from the pinned source run
        if: env.SOURCE_RUN_ID != ''
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ACTIONS_READ_TOKEN || github.token }}
        run: python3 scripts/release.py fetch
      - name: Resolve release inputs
        id: plan
        if: steps.source.outputs.active == 'true' && env.SOURCE_RUN_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan
      - name: Set up verification tools
        if: env.SOURCE_RUN_ID != '' || steps.plan.outputs.publish == 'true'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"
      - name: Set up plugin build
        if: steps.plan.outputs.build == 'true'
        working-directory: source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          git submodule update --init --depth=1 --filter=blob:none -- upstream/release/tools/base
      - name: Build signed Android plugins
        if: steps.plan.outputs.build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pocketstudio-release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          python3 scripts/release.py build
      - name: Verify signed packages
        if: (env.SOURCE_RUN_ID != '' || steps.plan.outputs.publish == 'true') && github.event_name == 'workflow_dispatch' && !inputs.publish
        run: python3 scripts/release.py verify
      - name: Verify signatures and publish the store
        if: (env.SOURCE_RUN_ID != '' || steps.plan.outputs.publish == 'true') && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
