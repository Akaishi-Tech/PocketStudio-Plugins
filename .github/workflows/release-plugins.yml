name: Release Pocket Studio plugins
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/release.py'
      - 'scripts/test_release.py'
      - '.github/workflows/release-plugins.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugins to synchronize
        type: choice
        options: [all, codex, android, avf, proot]
        default: all
      source_run_id:
        description: Source build run ID (defaults to the latest successful build)
        type: string
        required: false
      publish:
        description: Publish the verified packages to the store
        type: boolean
        default: true
      staging_tag:
        description: Optional draft tag for an individual plugin
        type: string
        required: false

concurrency:
  group: plugin-store-release
  queue: max

permissions: {}
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: write
    env:
      PLUGIN: ${{ inputs.plugin || 'all' }}
      STAGING_TAG: ${{ inputs.staging_tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CAN_SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check release behavior
        run: python3 -B scripts/test_release.py
      - name: Synchronize published listings and icons
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py listings
      - name: Choose package source
        id: mode
        run: |
          if [[ -n "$STAGING_TAG" ]]; then
            [[ -z "$SOURCE_RUN_ID" && "$PLUGIN" != "all" ]]
            echo "value=staging" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$SOURCE_RUN_ID" && "$CAN_SIGN" == true && ( "$PLUGIN" == codex || "$PLUGIN" == android ) ]]; then
            echo "value=checkout" >> "$GITHUB_OUTPUT"
          else
            echo "value=artifacts" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover successful source build
        if: steps.mode.outputs.value == 'artifacts'
        id: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ACTIONS_READ_TOKEN || github.token }}
        run: python3 scripts/release.py select
      - name: Download updated plugin packages
        id: packages
        if: steps.source.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish && steps.source.outputs.run_id != '')
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ACTIONS_READ_TOKEN || github.token }}
        run: python3 scripts/release.py fetch
      - name: Check out current source for a direct build
        if: steps.mode.outputs.value == 'checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Akaishi-Tech/PocketStudio
          path: source
          persist-credentials: false
      - name: Resolve staging or direct-build inputs
        if: steps.mode.outputs.value != 'artifacts'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan
      - name: Set up Java for manifest inspection
        if: steps.packages.outcome == 'success' || steps.plan.outputs.publish == 'true'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Set up direct build
        if: steps.plan.outputs.build == 'true'
        working-directory: source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
          git submodule update --init --depth=1 --filter=blob:none -- upstream/release/tools/base
      - name: Build signed Android plugin
        if: steps.plan.outputs.build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pocketstudio-release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          python3 scripts/release.py build
      - name: Verify package metadata and contents
        if: (steps.packages.outcome == 'success' || steps.plan.outputs.publish == 'true') && github.event_name == 'workflow_dispatch' && !inputs.publish
        run: python3 scripts/release.py verify
      - name: Publish updated packages and catalog
        if: (steps.packages.outcome == 'success' || steps.plan.outputs.publish == 'true') && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
